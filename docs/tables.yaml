# SPDX-License-Identifier: Apache-2.0
#
# Results tables in the submission, generated from the CSVs rather than typed.
#
# A table transcribed by hand is the same defect class as a transcribed sentence, but larger:
# the coverage table alone carries 24 numbers, and one stale entry after a re-run is invisible
# to every proofread.  scripts/make_tex.py renders each spec below into a LaTeX tabular that
# the document \input{}s, so the paper and results/tables/*.csv cannot disagree.
#
# Fields:
#   key       macro-free filename stem; the document inputs generated/table-<key>.tex
#   source    path relative to the repository root
#   caption   LaTeX caption
#   label     LaTeX \label
#   rows      optional list of selectors; omitted means every row, in file order
#   columns   ordered list of {from, header, format}; `derived` builds a column from others
#
# Headers containing LaTeX use SINGLE quotes.  A YAML double-quoted scalar processes
# backslash escapes, so "$\chi$" fails to parse on the unknown escape \c, and any header
# that happened to use a valid escape would silently lose its backslash instead.
#   align     tabular column specification

tables:
  - key: mps
    source: results/tables/mps_h4.csv
    caption: >
      H4 in the band: matrix-product-state against the tuned gradient-boosted baseline on
      identical rows and features.  Intervals are 95\,\% card-clustered bootstraps.  Every
      interval contains zero, and the comparison is underpowered against its pre-registered
      ceiling, so what is established is a non-superiority bound rather than a null.
    label: tab:mps
    align: rrrrlr
    columns:
      - {from: bond_dimension, header: '$\chi$', format: "{:.0f}"}
      - {from: ap_mps, header: AP (MPS), format: "{:.4f}"}
      - {from: ap_gbdt, header: AP (GBDT), format: "{:.4f}"}
      - {from: ap_difference, header: '$\Delta$AP', format: "{:+.4f}"}
      - {derived: confidence_interval, header: '95\,\% CI'}
      - {from: p_value, header: '$p$', format: "{:.3f}"}

  - key: rolling
    source: results/tables/rolling_origin.csv
    caption: >
      The temporal deviation across five rolling calibration origins.  Two of five breach and
      the earliest is conservative, so no single ratio characterises the effect.
    label: tab:rolling
    align: rrrl
    columns:
      - {from: cal_start, header: Origin (day), format: "{:.0f}"}
      - {from: ratio, header: Ratio, format: "{:.3f}"}
      - {from: observed, header: Errors, format: "{:.0f}"}
      - {derived: interval_verdict_rolling, header: Verdict (interval)}

  - key: coverageseeds
    source: results/tables/coverage_seed_summary.csv
    caption: >
      Coverage across five seeds per arm and level, judged against the exact Beta-Binomial
      interval.  This replaces a single-split table whose temporal ratio at $\alpha = 0.01$
      was the across-seed \emph{maximum} rather than its centre, and which described the
      card-disjoint arm as inside the interval at every level.  The temporal arm breaches on
      every seed at the two loosest levels; the stratified arm breaches on none at any level.
    label: tab:coverageseeds
    align: lrrrl
    rows:
      - {arm: temporal, alpha: 0.01}
      - {arm: temporal, alpha: 0.005}
      - {arm: temporal, alpha: 0.002}
      - {arm: temporal, alpha: 0.001}
      - {arm: stratified, alpha: 0.01}
      - {arm: stratified, alpha: 0.001}
      - {arm: card_disjoint, alpha: 0.01}
      - {arm: card_disjoint, alpha: 0.001}
    columns:
      - {from: arm, header: Arm, format: label}
      - {from: alpha, header: '$\alpha$', format: "{:.3f}"}
      - {from: ratio_mean, header: Ratio (mean), format: "{:.3f}"}
      - {from: ratio_sd, header: sd, format: "{:.3f}"}
      - {derived: seeds_outside, header: Seeds outside}

  - key: splitarm
    source: results/tables/split_arm_baselines.csv
    caption: >
      The same gradient-boosted model, the same hyperparameters, five seeds, evaluated on the
      test block of three different splits.  A stratified random split inflates average
      precision by 0.316 over a forward holdout, with non-overlapping ranges.  This is the
      cleanest evidence in the study that a random split does not measure what a deployed
      fraud model faces. It is one model on one file, so it establishes the size of the effect
      here rather than a general rule, and it costs nothing to obtain: it is the control arm of
      the split design, not an extra experiment.
    label: tab:splitarm
    align: lrrr
    rows:
      - {arm: stratified}
      - {arm: temporal}
      - {arm: card_disjoint}
    columns:
      - {from: arm, header: Split, format: label}
      - {from: roc_auc_mean, header: ROC AUC, format: "{:.4f}"}
      - {from: average_precision_mean, header: AP, format: "{:.4f}"}
      - {derived: ap_inflation, header: AP vs forward holdout}

  - key: metrics
    source: results/tables/baselines.csv
    caption: >
      The challenge statement's primary evaluation metrics, on the held-out temporal block at
      the default decision threshold, for the tuned gradient-boosted baseline.  Reported
      because the statement names all of them and a certificate is not a substitute for any of
      them.  Recall is low because a forward holdout is a harder task than the
      cross-validation the published leaderboard figures come from, not because the baseline
      is untuned; the body measures that difference directly.
    label: tab:metrics
    align: rrrrrrrrr
    rows:
      - {model: xgboost, arm: temporal, block: test, seed: 20260828}
    columns:
      - {from: roc_auc, header: 'ROC AUC', format: "{:.4f}"}
      - {from: average_precision, header: AUPRC, format: "{:.4f}"}
      - {from: f1, header: '$F_1$', format: "{:.4f}"}
      - {from: precision, header: Precision, format: "{:.4f}"}
      - {from: recall, header: Recall, format: "{:.4f}"}
      - {from: tp, header: TP, format: "{:.0f}"}
      - {from: fp, header: FP, format: "{:.0f}"}
      - {from: fn, header: FN, format: "{:.0f}"}
      - {from: tn, header: TN, format: "{:.0f}"}
