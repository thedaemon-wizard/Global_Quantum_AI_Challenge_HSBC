# SPDX-License-Identifier: Apache-2.0
#
# Every number that appears in prose, bound to the table it comes from.
#
# This file exists because prose and tables have disagreed four times in this project:
# a card-overlap figure of 84.8 % against a measured 0.849623, degeneracy counts transcribed
# from the stratified arm of a superseded split, a count-weighted percentage spliced into a
# value-weighted paragraph, and a claim of "all 24 combinations" against a different row
# count.  Each was caught by reading.  Reading does not scale to a five-page proposal with
# an appendix, and it does not survive a late edit.
#
# scripts/check_claims.py recomputes every entry from its source table and fails on any
# mismatch beyond the stated tolerance.  scripts/make_tex.py emits each as a LaTeX macro, so
# the proposal cannot contain a number that was typed rather than measured.
#
# Fields:
#   key        LaTeX macro name (\ClaimKey) and the identifier used in review
#   value      the number as it will appear, at the precision it will appear
#   source     path relative to the repository root
#   select     column -> value filters identifying the row; omit for single-row tables
#   column     column to read
#   scale      multiply the table value by this before comparing; use 100 to state a stored
#              fraction as a percentage.  The table stays the source of truth either way.
#   tolerance  absolute tolerance for the comparison, in the units of `value` after scaling
#   note       why this number matters, for a reviewer who does not know the study

claims:
  # -------------------------------------------------------------------- split and data
  - key: CardOverlap
    value: 85.0
    source: results/tables/data_integrity.csv
    select: {arm: temporal}
    column: fraction_test_entities_seen_in_train
    scale: 100
    tolerance: 0.05
    note: >
      Fraction of test-block card1 values also present in training.  Quoted as 85.0 % in
      prose; an earlier draft said 84.8 %.  This is why row-level exchangeability fails and
      every interval is a card-level block bootstrap.

  - key: TwoSampleAucTemporal
    value: 0.5525
    source: results/tables/data_integrity.csv
    select: {arm: temporal}
    column: cal_vs_test_two_sample_auc
    tolerance: 0.00005
    note: >
      Distinguishability of D_cal from D_test without the entity key.  The with-entity
      figure is reported alongside because including card1 while partitioning by card1 is
      circular; the card-disjoint arm scores 0.9685 with it and 0.6554 without.

  - key: CalFraudCount
    value: 2121
    source: results/tables/splits.csv
    select: {arm: temporal, block: cal}
    column: n_fraud
    tolerance: 0
    note: Fraud rows in D_cal, temporal arm.  Sets the fraud-conditional degeneracy floor.

  - key: CalLegitCount
    value: 58343
    source: results/tables/splits.csv
    select: {arm: temporal, block: cal}
    column: n_legit
    tolerance: 0
    note: >
      Legitimate rows in D_cal, temporal arm.  The guarantee lives on this class.  An
      earlier protocol table read 56,993, taken from the stratified arm of a superseded
      split.

  - key: DecisionEntries
    value: 89
    source: results/tables/decision_log.csv
    column: decision_entries
    tolerance: 0
    note: >
      Entries in docs/decisions.md, counted from the file.  It was typed into four places and
      went stale in all of them -- the README said 29 twice and both PDF sources said
      thirty-one against an actual 38.  Computing it was necessary and not sufficient: the
      table was computed once and not regenerated after two entries were appended, so both
      PDFs printed 61 against an actual 63 while this gate passed -- it compares the value
      here to the table, and nothing compared the table to the document.  `make derived` now
      regenerates it inside `make claims`, and
      test_decision_log_matches_the_decisions_document asserts the two agree.

  - key: ProtocolAmendments
    value: 9
    source: results/tables/decision_log.csv
    column: protocol_amendments
    tolerance: 0
    note: >
      Amendment headings in docs/protocol.md, counted from the file.  The shipped appendix
      said "Four were made" and enumerated A1-A4 while the protocol carried A1-A7 -- an
      under-report of the pre-registration's own revision history, in the document a reviewer
      reads to judge whether the pre-registration was honoured.  Bound here so the appendix
      cannot restate it.

  # --------------------------------------------------------------- split arms (D-016)
  - key: SplitApStratified
    value: 0.8254
    source: results/tables/split_arm_baselines.csv
    select: {arm: stratified}
    column: average_precision_mean
    tolerance: 0.00005
    note: >
      Average precision of the tuned baseline on a stratified random split, mean of five
      seeds.  The comparison against SplitApTemporal is the study's cleanest evidence that a
      random split cannot evaluate a fraud model.

  - key: SplitApTemporal
    value: 0.5090
    source: results/tables/split_arm_baselines.csv
    select: {arm: temporal}
    column: average_precision_mean
    tolerance: 0.00005
    note: The same model on a forward holdout, mean of five seeds.

  - key: SplitApInflation
    value: 0.3164
    source: results/tables/split_arm_baselines.csv
    select: {arm: stratified}
    column: ap_inflation_vs_temporal
    tolerance: 0.00005
    note: >
      The difference.  Larger than any effect either quantum arm could have produced, and
      obtainable without a quantum method.

  - key: CardDisjointSdTightest
    value: 0.362
    source: results/tables/coverage_seed_summary.csv
    select: {arm: card_disjoint, alpha: 0.001}
    column: ratio_sd
    tolerance: 0.0005
    note: >
      Seed-to-seed spread of the card-disjoint arm at the tightest level, an order of
      magnitude wider than the temporal arm's 0.020.  It is why that arm's single breach
      there reads as noise rather than a systematic failure.

  # ------------------------------------------------------- H5, the held-out validation
  - key: HFiveConfigsHolding
    value: 5
    source: results/tables/h5_validation.csv
    reduce: {op: sum, column: holds_at_alpha}
    tolerance: 0
    note: >
      Certified configurations whose realised band-conditional false-decline rate on D_test
      is at or below the alpha they were certified at.  Until this table existed the study's
      headline deliverable had no held-out evidence at all.

  - key: HFiveConfigsTotal
    value: 5
    source: results/tables/h5_validation.csv
    reduce: {op: count}
    tolerance: 0
    note: Certified configurations validated.

  - key: HFiveWorstRatio
    value: 0.856
    source: results/tables/h5_validation.csv
    reduce: {op: max_ratio, columns: [realised_risk, alpha]}
    tolerance: 0.0005
    note: >
      The tightest case: realised risk as a fraction of the alpha it was certified at.  Below
      one means the certificate held; 0.856 means it held with little margin at the one
      configuration certified at alpha = 0.10.

  # ------------------------------------------------------------------------- coverage

  # -------------------------------------------------------------- rolling origin (D-025)
  - key: RollingRatioMin
    value: 0.684
    source: results/tables/rolling_origin.csv
    select: {cal_start: 101}
    column: ratio
    tolerance: 0.0005
    note: >
      Earliest origin, conservative.  With RollingRatioMax this is the evidence that the
      temporal deviation is origin-dependent and that no single ratio can be quoted.

  - key: RollingRatioMax
    value: 1.411
    source: results/tables/rolling_origin.csv
    select: {cal_start: 121}
    column: ratio
    tolerance: 0.0005
    note: Largest breach across the five origins.

  # --------------------------------------------------------------- quantum kernel screens
  - key: ScreenPassBoth
    value: 0
    source: results/tables/screens.csv
    reduce: {op: sum_and, columns: [passes_conditioning, passes_distinctness]}
    tolerance: 0
    note: >
      Configurations passing both a-priori gates, out of 120.  Zero.  The kernel arm was
      rejected before being run on the decision task.

  - key: ScreenPassConditioning
    value: 28
    source: results/tables/screens.csv
    reduce: {op: sum, column: passes_conditioning}
    tolerance: 0
    note: Configurations that are not exponentially concentrated.

  - key: ScreenMedianRbf
    value: 0.9740
    source: results/tables/screens.csv
    reduce: {op: median, column: rbf_correlation}
    tolerance: 0.00005
    note: >
      Median correlation against a tuned RBF across all screened configurations.  Quoting only
      the minimum, as an earlier draft did, gave the weakest available version of the finding:
      the typical configuration is a near-perfect RBF, not a marginal one.

  - key: ScreenMaxRbf
    value: 1.0000
    source: results/tables/screens.csv
    reduce: {op: max, column: rbf_correlation}
    tolerance: 0.00005
    note: Highest correlation. Some configurations are indistinguishable from an RBF.

  - key: ScreenMinRbfCorrelation
    value: 0.6291
    source: results/tables/screens.csv
    reduce: {op: min, column: rbf_correlation}
    tolerance: 0.00005
    note: >
      Closest any configuration came to distinctness, against a 0.60 threshold.  Every
      kernel tried is reproducible by a tuned RBF.

  - key: ScreenSamples
    value: 300
    source: results/tables/screens.csv
    reduce: {op: max, column: n_samples}
    tolerance: 0
    note: >
      Stratified rows per screened configuration.  The challenge statement makes stating the
      quantum-execution sample count its only mandatory reporting requirement.

  # ----------------------------------------------------------------------- tensor network
  - key: MpsApBestChi
    value: 0.1235
    source: results/tables/mps_band.csv
    select: {model: mps, bond_dimension: 32}
    column: average_precision
    tolerance: 0.00005
    note: Best in-band average precision across the bond-dimension sweep.

  - key: GbdtApBand
    value: 0.1407
    source: results/tables/mps_band.csv
    select: {model: xgboost}
    column: average_precision
    tolerance: 0.00005
    note: The tuned baseline on identical rows and features.

  - key: MpsDeltaApBestChi
    value: -0.0172
    source: results/tables/mps_h4.csv
    select: {bond_dimension: 32}
    column: ap_difference
    tolerance: 0.00005
    note: Paired difference, MPS minus GBDT, at the largest bond dimension.

  - key: MpsCiHighBestChi
    value: 0.0200
    source: results/tables/mps_h4.csv
    select: {bond_dimension: 32}
    column: ci_high
    tolerance: 0.00005
    note: >
      Upper end of the 95 % clustered interval.  This is the non-superiority bound the
      study actually establishes: any MPS improvement is under roughly +0.02 AP.

  - key: MpsStandardErrorBestChi
    value: 0.0199
    source: results/tables/mps_h4.csv
    select: {bond_dimension: 32}
    column: standard_error
    tolerance: 0.00005
    note: >
      The measured cross-family standard error.  Compare against the within-family 0.0025
      the first power gate used; the eightfold gap is D-030.

  - key: CertifiedConfigs
    value: 5
    source: results/tables/riskcontrol.csv
    reduce: {op: sum, column: certified}
    tolerance: 0
    note: Configurations that certify, out of RiskConfigs.  All strictly inside the band.

  - key: RiskConfigs
    value: 48
    source: results/tables/riskcontrol.csv
    reduce: {op: count}
    tolerance: 0
    note: Total configurations on the pre-registered risk-control grid.

  - key: BandLegitCalMin
    value: 847
    source: results/tables/riskcontrol.csv
    reduce: {op: min, column: n_legit_band_cal}
    tolerance: 0
    note: >
      Legitimate in-band rows in D_cal at the tightest band budget.  This is the sample
      size the band-conditional certificate has to work with, and why nothing certifies
      below alpha = 0.10.

  - key: BandLegitCalCertifiedMin
    value: 1572
    source: results/tables/riskcontrol.csv
    reduce:
      op: min
      column: n_legit_band_cal
      where_equals: {certified: True}
    tolerance: 0
    note: >
      Smallest calibration block behind a configuration that actually certified.  Distinct
      from BandLegitCalMin, which is the tightest budget's block and certifies nothing: the
      two were conflated in the feasibility section, attaching the shipped certificate to a
      sample size no certificate was issued at.

  # ------------------------------------------------ the operating point (predictions.csv)
  - key: OperatingApproveShare
    value: 86.72
    scale: 100
    source: results/tables/operating_point.csv
    select: {decision: approve}
    column: share
    tolerance: 0.01
    note: >
      Share of held-out traffic the rule approves outright, at the certified configuration
      with the tightest alpha.  The proposal argues a three-valued rule is what makes the
      problem tractable at scale; this is the number that argument needs.

  - key: OperatingStepUpShare
    value: 9.35
    scale: 100
    source: results/tables/operating_point.csv
    select: {decision: stepped up overall}
    column: share
    tolerance: 0.01
    note: >
      Share routed to a 3-D Secure challenge.  Under ten per cent is the point: routing this
      volume to human analysts is not possible and a step-up is.

  - key: OperatingDeclineShare
    value: 4.80
    scale: 100
    source: results/tables/operating_point.csv
    select: {decision: declined overall}
    column: share
    tolerance: 0.01
    note: >
      Share declined, counting both the outer threshold and the in-band rule.  Reported so the
      operating point can be read against the decline budget the protocol fixes.

  - key: ScreenConfigs
    value: 120
    source: results/tables/screens.csv
    reduce: {op: count}
    tolerance: 0
    note: >
      Kernel configurations screened: encoding x qubits x bandwidth x entanglement.

  - key: CertificateMargin
    value: 0.0136
    source: results/tables/riskcontrol.csv
    reduce: {op: min_margin, columns: [band_hi, selected_lambda], where: certified}
    tolerance: 0.00005
    note: >
      Smallest distance between a certified lambda and the upper band edge.  It must be
      strictly positive: at band_hi the flagged set is empty by construction and the risk is
      structurally zero, which is what made an earlier certificate vacuous.

  # ------------------------------------------------------ tensor network, full scale
  - key: GbdtFullAucMin
    value: 0.8837
    source: results/tables/baselines.csv
    reduce: {op: min, column: roc_auc, where_equals: {arm: temporal, block: test}}
    tolerance: 0.00005
    note: >
      Lowest tuned gradient-boosted ROC AUC across seeds on the temporal test block.  With
      GbdtFullAucMax this is the interval the full-scale tensor network is compared against.

  - key: GbdtFullAucMax
    value: 0.8884
    source: results/tables/baselines.csv
    reduce: {op: max, column: roc_auc, where_equals: {arm: temporal, block: test}}
    tolerance: 0.00005
    note: Highest tuned baseline ROC AUC across seeds, temporal test block.

  - key: GbdtFullApMin
    value: 0.5055
    source: results/tables/baselines.csv
    reduce: {op: min, column: average_precision, where_equals: {arm: temporal, block: test}}
    tolerance: 0.00005
    note: >
      Lowest tuned baseline average precision on the temporal test block.  The full-scale
      tensor network's best draw reaches SweepBestAp, roughly half of this.

  - key: GbdtFullApMax
    value: 0.5114
    source: results/tables/baselines.csv
    reduce: {op: max, column: average_precision, where_equals: {arm: temporal, block: test}}
    tolerance: 0.00005
    note: Highest tuned baseline average precision across seeds, temporal test block.

  - key: TestFraudRate
    value: 3.412
    scale: 100
    source: results/tables/splits.csv
    select: {arm: temporal, block: test}
    column: count_fraud_rate
    tolerance: 0.0005
    note: >
      Count-weighted fraud rate on the test block, as a percentage.  Quoted where the choice
      of average precision over ROC AUC is justified by the class balance.

  # ---------------------------------------------- full-scale sweep, seed-replicated (D-040)
  - key: SweepSeedSpread
    value: 0.1781
    source: results/tables/mps_seed_sweep_summary.csv
    reduce: {op: max, column: ap_seed_spread}
    tolerance: 0.00005
    note: >
      Largest average-precision spread across four seeds at a FIXED bond dimension, over the
      sixteen-job sweep.  Compare SweepChiSpread.

  - key: SweepChiSpread
    value: 0.0629
    source: results/tables/mps_seed_sweep_summary.csv
    reduce: {op: max, column: ap_across_chi_spread}
    tolerance: 0.00005
    note: >
      Spread of the seed MEANS across bond dimension.  It is 2.8 times smaller than the
      within-configuration seed spread, so capacity is not resolvable at full scale even with
      replication -- which settles D-038's withdrawal at every bond dimension rather than one.

  - key: SweepStalled
    value: 2
    source: results/tables/mps_seed_sweep_summary.csv
    reduce: {op: sum_values, column: n_stalled}
    tolerance: 0
    note: >
      Fits that never left chance, out of sixteen.  Both at seed 20260831, at different bond
      dimensions.  They are on the sequential fold, which is the stable contraction path, so
      this is a property of the ansatz rather than of the D-036 reduction tree.

  - key: SweepBestAp
    value: 0.2512
    source: results/tables/mps_seed_sweep.csv
    reduce: {op: max, column: average_precision}
    tolerance: 0.00005
    note: >
      The best of sixteen full-scale draws.  Quoted as the ceiling of what the arm achieved,
      not as a result: the seed spread exceeds the spread across bond dimension, so it is one
      draw rather than a property of a configuration.

  - key: SweepJobs
    value: 16
    source: results/tables/mps_seed_sweep_summary.csv
    reduce: {op: sum_values, column: n_seeds}
    tolerance: 0
    note: >
      Full-scale fits in the sweep: four bond dimensions at four seeds each.

  # ----------------------------------------------------------------------------- power grid
  - key: PowerSeCrossFamily
    value: 0.0164
    source: results/tables/power.csv
    column: se_cross_family
    tolerance: 0.00005
    note: >
      Cross-family noise proxy, a regularised logistic model against gradient boosting on
      identical rows.  It is the binding one and it lands close to the standard error the
      tensor-network comparison actually produced, where the within-family figure was
      eightfold low.

  - key: PowerMde
    value: 0.0461
    source: results/tables/power.csv
    column: minimum_detectable_effect
    tolerance: 0.00005
    note: >
      The minimum detectable effect this comparison actually supports.  It exceeds the
      pre-registered ceiling, so H4 is reported as underpowered rather than null.

  # -------------------------------------------------------------- regulation (amendment A2)
  - key: BandValueFraudRate
    value: 5.554
    scale: 100
    source: results/tables/splits.csv
    select: {arm: temporal, block: band}
    column: value_fraud_rate
    tolerance: 0.0005
    note: >
      Value-weighted fraud rate on D_band.  Quoted as 5.554 % in the appendix.  It is roughly
      forty times the loosest PSD2 SCA-RTS ceiling, which is why those ceilings cannot select
      a decline threshold on this file.  Not a file-level figure and not the abstention band:
      three documents attributed it to IEEE-CIS as a whole, which is 3.867 %, and the appendix
      briefly attributed it to the abstention region.  Both were wrong in the same direction.

  - key: PsdDeclineRate
    value: 94.74
    scale: 100
    source: results/tables/envelope.csv
    select: {etv_eur: 500}
    column: decline_rate
    tolerance: 0.005
    note: >
      Fraction of traffic that must be declined to meet the strictest PSD2 ceiling on this
      benchmark.  Reported to show the category error, not as an operating point.

  # ----------------------------------------------------------------------------- power
  - key: PowerSeWithinFamily
    value: 0.0025
    source: results/tables/power.csv
    column: se_within_family
    tolerance: 0.00005
    note: Seed-to-seed noise of the baseline against itself.  A floor, not a description.

  - key: PowerCeiling
    value: 0.023
    source: results/tables/power.csv
    column: preregistered_ceiling
    tolerance: 0.0000005
    note: The pre-registered MDE ceiling above which H4 is declared underpowered.

  # ------------------------------------------- counts the prose used to spell out in words
  # Spelling a measurement as a word ("four of five", "sixty-four-fold") hides it from the
  # literal scan in scripts/check_pdf.py completely.  These bind the ones that were.
  - key: CoverageSeeds
    value: 5
    source: results/tables/coverage_seed_summary.csv
    reduce: {op: max, column: n_seeds}
    note: Seeds per arm and level behind every coverage count below.

  - key: TemporalOutsideMid
    value: 4
    source: results/tables/coverage_seed_summary.csv
    select: {arm: temporal, alpha: 0.002}
    column: n_outside
    note: >
      Temporal seeds outside the Beta-Binomial interval at the third-loosest level.  It is
      five of five at the two loosest and zero of five at the tightest, so the breach is not
      monotone in alpha and the level has to be named whenever the count is quoted.

  - key: CardDisjointOutsideLoosest
    value: 2
    source: results/tables/coverage_seed_summary.csv
    select: {arm: card_disjoint, alpha: 0.010}
    column: n_outside
    note: >
      Both deviations are CONSERVATIVE -- the arm over-covers, ratio 0.785 and 0.795 against
      a nominal 1.  It fails a two-sided fit check without breaching the one-sided coverage
      guarantee, and the prose must say which, or a reader reads it as a control-arm failure.

  - key: CardDisjointOutsideTightest
    value: 1
    source: results/tables/coverage_seed_summary.csv
    select: {arm: card_disjoint, alpha: 0.001}
    column: n_outside
    note: >
      The single deviation at the tightest level is ANTI-conservative -- it under-covers --
      which is the opposite of the two at alpha = 0.01.  An earlier draft generalised the
      conservative direction across both levels and printed "in every case it over-covers",
      which was false of exactly this cell and false in the flattering direction.  The two
      levels must be described separately.

  - key: CardDisjointTightestWorstRatio
    value: 1.5245
    source: results/tables/coverage_by_arm_seeds.csv
    reduce:
      op: max
      column: ratio
      where_equals: {arm: card_disjoint, alpha: 0.001}
    tolerance: 0.0005
    note: >
      Empirical over nominal for the one seed that breaches at the tightest level.  Above one
      means under-coverage, the same direction as the temporal arm's failure -- so this cell
      cannot be reported as a two-sided-fit issue only.

  - key: CardDisjointTightestBestRatio
    value: 0.6502
    source: results/tables/coverage_by_arm_seeds.csv
    reduce:
      op: min
      column: ratio
      where_equals: {arm: card_disjoint, alpha: 0.001}
    tolerance: 0.0005
    note: >
      The other four seeds at that level all sit below one.  Quoted beside the breaching seed
      so a reader can see it is one against four -- noise rather than a systematic breach,
      and still not a pass.

  - key: RollingOrigins
    value: 5
    source: results/tables/rolling_origin.csv
    reduce: {op: count}
    note: Rolling calibration origins behind the origin-dependence result (D-025).

  - key: RollingBreaches
    value: 2
    source: results/tables/rolling_origin.csv
    reduce: {op: count, where_equals: {verdict: BREACHED}}
    note: >
      Origins whose deviation exceeds the interval upward.  The earliest is conservative
      instead, which is why no single ratio characterises the temporal effect.

  - key: SweepChiMin
    value: 4
    source: results/tables/mps_seed_sweep_summary.csv
    reduce: {op: min, column: bond_dimension}

  - key: SweepChiMax
    value: 32
    source: results/tables/mps_seed_sweep_summary.csv
    reduce: {op: max, column: bond_dimension}

  - key: PsdLoosestCeiling
    value: 0.13
    source: results/tables/envelope.csv
    reduce: {op: max, column: reference_value_fraud_rate}
    scale: 100
    tolerance: 0.0000005
    note: The loosest PSD2 SCA-RTS reference fraud rate on the grid, as a percentage.

  - key: MpsMdeRealised
    value: 0.0557
    source: results/tables/mps_h4.csv
    select: {bond_dimension: 32}
    column: minimum_detectable_effect_realised
    tolerance: 0.00005
    note: >
      What the H4 comparison could actually have detected, from its own bootstrap standard
      error.  Distinct from the pre-registered PowerMde, which was estimated from proxies
      before the run and is the commitment rather than the finding.  This is the figure the
      body reports, because it is the larger and therefore the more conservative of the two.

  # ------------------------------------------------------------ derived from other claims
  # A ratio typed by hand does not move when its inputs do.  The proposal claimed a
  # "thousandfold" FLOP span for a grid that spans sixty-four; these cannot drift that way.
  - key: SweepSpreadRatio
    value: 2.83
    derived: {op: ratio, of: [SweepSeedSpread, SweepChiSpread]}
    tolerance: 0.005
    note: How much larger seed noise is than the capacity signal at full scale.

  - key: SweepChiFlopSpan
    value: 64
    derived: {op: ratio, of: [SweepChiMax, SweepChiMin], power: 2}
    note: >
      The arithmetic span a chi-squared cost model predicts across the measured bond
      dimensions.  Per-step cost is flat against it, which is the launch-bound finding.

  - key: PowerSeRatio
    value: 8.03
    derived: {op: ratio, of: [MpsStandardErrorBestChi, PowerSeWithinFamily]}
    tolerance: 0.005
    note: Cross-family noise against within-family, the ratio that made H4 underpowered.

  - key: BandFraudVersusCeiling
    value: 42.7
    derived: {op: ratio, of: [BandValueFraudRate, PsdLoosestCeiling]}
    tolerance: 0.05
    note: How far a fraud-enriched research benchmark sits from a portfolio ceiling.

  - key: MdeSampleFactor
    value: 7.77
    derived: {op: ratio, of: [MpsMdeRealised, MpsCiHighBestChi], power: 2}
    tolerance: 0.005
    note: >
      Factor by which the in-band evaluation set would have to grow to resolve an effect the
      size of the upper interval edge, since the detectable effect scales as n^-1/2.

  # ------------------------------------------------- resource figures for the Phase II plan
  # Feasibility is scored on whether the resource requirements are realistic.  These are
  # measured on this study's own runs rather than estimated, which is the whole argument.
  - key: SweepSecondsMin
    value: 2747
    source: results/tables/mps_seed_sweep.csv
