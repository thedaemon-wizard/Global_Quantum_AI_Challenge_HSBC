  # ------------------------------------------- E2, the label-censoring audit (DS-2 threat)
  # Measured from the first round and reported nowhere until 2026-08-30.  It matters because
  # it is the obvious objection to the temporal result: if recent fraud is simply not yet
  # labelled, a forward holdout would show a coverage breach that is an artefact.
  - key: CensoringTau
    value: -0.2857
    source: results/tables/label_verdict.csv
    column: mann_kendall_tau
    tolerance: 0.00005
    note: Mann-Kendall trend statistic over the per-bucket fraud rate. No monotone trend.

  - key: CensoringP
    value: 0.3988
    source: results/tables/label_verdict.csv
    column: mann_kendall_p
    tolerance: 0.00005

  - key: CensoringTrailingRate
    value: 3.666
    source: results/tables/label_verdict.csv
    column: trailing_rate
    scale: 100
    tolerance: 0.0005
    note: >
      Fraud rate in the trailing label window, as a percentage.  It is *higher* than the
      earlier rate, which is the opposite of what censoring would produce.

  - key: CensoringEarlierRate
    value: 3.281
    source: results/tables/label_verdict.csv
    column: earlier_rate
    scale: 100
    tolerance: 0.0005

  # ---------------------------------------------------- E13 inference latency, added 2026-08-30
  # The challenge statement names "latency vs. complexity" as a bottleneck and puts the whole
  # authorisation flow at 100-300 ms with about 130 ms of network.  The proposal's answer had
  # been volume arithmetic ("a few percent of traffic") with no timing behind it.  These bind it.
  #
  # Every figure is from the 1-thread CPU profile, which is the per-request serving shape.  The
  # all-core rows in the table are ~250x slower at batch 1 and are kept there as the documented
  # trap: XGBoost defaults its thread count to the core count, and synchronising 20 threads over
  # one row costs far more than the prediction.  See D-063.
  - key: LatencyScorerMedian
    value: 0.0841
    source: results/tables/latency.csv
    reduce:
      op: min
      column: per_transaction_p50_ms
      where_equals: {component: classical scorer, profile: 1-thread CPU, batch_size: 1}
    tolerance: 0.0005
    note: >
      Median cost of scoring one authorisation with the full-traffic classical model, single
      threaded, on all 431 features.  The classical core is not the latency risk.

  - key: LatencyScorerTail
    value: 0.3197
    source: results/tables/latency.csv
    reduce:
      op: min
      column: per_transaction_p99_ms
      where_equals: {component: classical scorer, profile: 1-thread CPU, batch_size: 1}
    tolerance: 0.002
    note: Tail cost per authorisation for the full-traffic scorer; a tail is what breaks a timeout.

  - key: LatencyKernelMedian
    value: 96.577
    source: results/tables/latency.csv
    reduce:
      op: min
      column: per_transaction_p50_ms
      where_equals: {component: quantum kernel (screened out), batch_size: 1}
    tolerance: 0.5
    note: >
      What one in-band authorisation would have cost against a 64-row support set, had the
      kernel arm survived its screens.  This is the figure the abstention band exists to ration.

  - key: LatencyKernelTail
    value: 129.08
    source: results/tables/latency.csv
    reduce:
      op: min
      column: per_transaction_p99_ms
      where_equals: {component: quantum kernel (screened out), batch_size: 1}
    tolerance: 0.5
    note: >
      Tail cost of one in-band kernel evaluation.  Against the residual budget the statement
      implies -- 300 ms less about 130 ms of network -- this consumes most of what is left, so
      the band is a necessary condition for affordability rather than a convenience.

  - key: LatencyAuthorisationBudgetMs
    value: 300
    source: results/tables/latency.csv
    reduce: {op: min, column: authorisation_budget_ms}
    note: >
      The authorisation ceiling the challenge statement states, carried in the table so the
      comparison and the measurement cannot drift apart.

  - key: LatencyNetworkMs
    value: 130
    source: results/tables/latency.csv
    reduce: {op: min, column: network_response_ms}
    note: The network share of that ceiling, as the challenge statement attributes it.

  - key: LatencyBudgetResidualMs
    value: 170
    source: results/tables/latency.csv
    reduce:
      op: min_margin
      columns: [authorisation_budget_ms, network_response_ms]
    note: >
      Issuer-side budget implied by the challenge statement: the 300 ms authorisation ceiling
      less the roughly 130 ms it attributes to network response.  Quoted for scale.

  - key: LatencyKernelVersusScorer
    value: 1148
    derived: {op: ratio, of: [LatencyKernelMedian, LatencyScorerMedian]}
    tolerance: 5
    note: >
      How much more one in-band kernel evaluation costs than one classical score.  Invisible
      until the thread count was controlled, because the OpenMP barrier dominated both.

  - key: LatencyKernelBudgetShare
    value: 75.9
    derived: {op: ratio, of: [LatencyKernelTail, LatencyBudgetResidualMs]}
    scale: 100
    tolerance: 0.5
    note: >
      Share of the residual issuer-side budget one in-band kernel evaluation would consume at
      the tail.  Under one, so it fits -- with little room, and only on the band.
